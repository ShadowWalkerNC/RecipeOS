name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'shared/**'
      - 'render.yaml'
      - 'supabase/functions/**'

jobs:
  # ── Web → Render ──────────────────────────────────────────
  web:
    name: Deploy Web (Render)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'web/') ||
      contains(github.event.head_commit.modified, 'shared/') ||
      contains(github.event.head_commit.modified, 'render.yaml')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npx next lint || true

      - name: Trigger Render deploy
        if: success()
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail

  # ── Edge Functions → Supabase ─────────────────────────────
  edge-functions:
    name: Deploy Edge Functions (Supabase)
    runs-on: ubuntu-latest
    if: contains(toJson(github.event.head_commit.modified), 'supabase/functions/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy ocr-recipe function
        run: supabase functions deploy ocr-recipe --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set edge function secrets
        run: |
          supabase secrets set OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
