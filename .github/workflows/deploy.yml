name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'shared/**'
      - 'render.yaml'

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npx next lint || true

      - name: Trigger Render deploy
        if: success()
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail
        # Set RENDER_DEPLOY_HOOK_URL in GitHub repo Settings → Secrets → Actions
        # Get the URL from Render dashboard → your service → Settings → Deploy Hook
